name: research

on:
  push:
    paths: ["research/**", "contracts/**", ".github/workflows/research.yml", "Makefile"]
  pull_request:
    paths: ["research/**", "contracts/**", ".github/workflows/research.yml", "Makefile"]

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: research/uv.lock
      - name: System libraries for MediaPipe
        run: sudo apt-get update -q && sudo apt-get install -y -q libgles2 libegl1
      - name: Sync environment
        run: make setup
      - name: Download face landmarker model
        run: make models
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test
