[project]
name = "eyegaze"
version = "2.0.0.dev0"
description = "Appearance-based gaze estimation for on-device (Android/LiteRT) gaze selection: data, training, evaluation, export."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dataset building: frame decoding + MediaPipe Face Landmarker + Parquet I/O.
data = [
    "opencv-contrib-python>=4.9",  # same distribution mediapipe depends on; avoids two cv2 packages
    "mediapipe>=0.10.14,<0.11",
    "pandas>=2.1,<3",
    "pyarrow>=15",
]
# Training / evaluation.
ml = [
    "torch>=2.5,<3",
    "scikit-learn>=1.4",  # SVR baseline for the calibration comparison (E2)
]

# LiteRT export + interpreter (parity tests, golden model).
export = [
    "litert-torch>=0.10",
    "ai-edge-litert>=2.3",
]

[project.scripts]
eyegaze = "eyegaze.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyegaze"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "NPY", "PT", "C4", "PIE", "RET"]
ignore = ["N803", "N806"]  # allow math-style names (X, R) in numerical code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["eyegaze"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "eyegaze.domain.*"
strict = true

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pyarrow.*", "sklearn.*", "litert_torch.*", "ai_edge_litert.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests",
    "requires_torch: needs the [ml] extra",
    "requires_mediapipe: needs the [data] extra and the face_landmarker.task model",
]
